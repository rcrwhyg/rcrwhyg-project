[package]
name = "rcrwhyg-server"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rcrwhyg-server"
path = "src/main.rs"
required-features = ["ssr"]

[[bin]]
name = "create-admin"
path = "src/bin/create-admin.rs"
required-features = ["ssr"]

[dependencies]
axum = { version = "0.8.9", optional = true, features = ["macros", "ws"] }
codee = "0.3"
console_error_panic_hook = { version = "0.1.7", optional = true }
dotenvy = "0.15.7"
futures-util = { version = "0.3", optional = true }
leptos = { version = "0.8.20" }
leptos-use = { version = "0.19", default-features = false, features = ["storage"] }
leptos_axum = { version = "0.8.10", optional = true }
leptos_meta = { version = "0.8.6" }
leptos_router = { version = "0.8.15" }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "runtime-tokio-rustls",
    "chrono",
], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }

thaw = { git = "https://github.com/thaw-ui/thaw", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"], optional = true }
tokio-stream = { version = "0.1", optional = true, features = ["time"] }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.7.0", features = ["fs"], optional = true }
wasm-bindgen = { version = "0.2.126", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "MouseEvent",
] }
argon2 = { version = "0.5.3", features = ["std"], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4.3", optional = true }
governor = { version = "0.10", optional = true }
cookie = { version = "0.18.1", optional = true }
http = { version = "1", optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "thaw/hydrate",
]
ssr = [
    "dep:axum",
    "dep:sqlx",
    "dep:chrono",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:futures-util",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "dep:pulldown-cmark",
    "dep:argon2",
    "dep:sha2",
    "dep:hex",
    "dep:governor",
    "dep:cookie",
    "dep:http",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos-use/ssr",
    "thaw/ssr",
]

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "rcrwhyg-server"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/rcrwhyg-server.css
style-file = "style/main.css"

tailwind-input-file = "style/tailwind.css"
tailwind-config-file = "tailwind.config.js"

# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

# [Optional] Command to use when running end2end tests. It will run in the end2end dir.
#   [Windows] for non-WSL use "npx.cmd playwright test"
#   This binary name can be checked in Powershell with Get-Command npx
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"
