name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy (recorded in deploy log)'
        required: false
        default: 'manual'

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LEPTOS_OUTPUT_NAME: rcrwhyg-server
  RUSTFLAGS: '-C strip=symbols'
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}

jobs:
  deploy-production:
    name: Deploy to Aliyun ECS (prod)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (stable + wasm + musl + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-leptos
        run: cargo install --locked cargo-leptos

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Install Zig (linker/cc for cargo-zigbuild)
        run: |
          ZIG_VER=0.16.0
          ZIG_DIR="/usr/local/lib/zig-x86_64-linux-${ZIG_VER}"
          curl -fsSLo /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz"
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local/lib
          echo "${ZIG_DIR}" >> "$GITHUB_PATH"
          # GITHUB_PATH only takes effect for LATER steps; call zig by full path here
          "${ZIG_DIR}/zig" version
          "${ZIG_DIR}/zig" cc -v >/dev/null 2>&1 && echo "zig cc OK"

      - name: Build site (WASM + CSS)
        run: cargo leptos build --release

      - name: Build static musl server
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl --features ssr --bin rcrwhyg-server

      # --- 部署统一走 runner 自带 openssh 原语：
      #     (appleboy/ssh-action@v1 只认 `script` 不认 `command`；scp-action 会保留 source 相对路径，
      #      两者都会把文件传到错误的嵌套目录 / 静默空跑。) ---
      - name: Configure SSH deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Upload deploy script
        run: scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy/remote.sh "$VPS_USER@$VPS_HOST:/opt/rcrwhyg/bin/remote.sh"

      - name: Stop service + clean transient dirs
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" 'sudo -n systemctl stop rcrwhyg.service || true; rm -rf /opt/rcrwhyg/bin/deploy /opt/rcrwhyg/target /opt/rcrwhyg/site.staging'

      - name: Upload new binary
        run: scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new target/x86_64-unknown-linux-musl/release/rcrwhyg-server "$VPS_USER@$VPS_HOST:/opt/rcrwhyg/rcrwhyg-server"

      - name: Upload new site dir
        run: |
          # site/ 内容流入 site.staging/
          tar -cf - -C target/site . | \
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            'rm -rf /opt/rcrwhyg/site.staging && mkdir -p /opt/rcrwhyg/site.staging && tar -C /opt/rcrwhyg/site.staging -xf -'
          # articles/ 单独流入 site.staging/（tar 顶层成员是 articles/，解到 staging 即 site.staging/articles/*.md）
          tar -cf - -C . articles | \
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/rcrwhyg/site.staging && tar -C /opt/rcrwhyg/site.staging -xf -'
          # data/ 单独流入 site.staging/（tar 顶层成员是 data/，解到 staging 即 site.staging/data/radar.json 等；不解到 site.staging/data/，避免嵌套 data/data/）
          tar -cf - -C . data | \
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/rcrwhyg/site.staging && tar -C /opt/rcrwhyg/site.staging -xf -'
          # content/ 单独流入 site.staging/（tar 顶层成员是 content/，解到 staging 即 site.staging/content/about.md）
          tar -cf - -C . content | \
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/rcrwhyg/site.staging && tar -C /opt/rcrwhyg/site.staging -xf -'

      - name: Swap + start + smoke + finalize
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "set -euo pipefail; \
            bash /opt/rcrwhyg/bin/remote.sh swap && \
            sudo -n systemctl start rcrwhyg.service && \
            bash /opt/rcrwhyg/bin/remote.sh smoke && \
            bash /opt/rcrwhyg/bin/remote.sh finalize '${GITHUB_REF_NAME}' '${GITHUB_SHA}' '${GITHUB_ACTOR}' '${REASON}'"
        env:
          REASON: ${{ github.event.inputs.reason || 'tag-push' }}